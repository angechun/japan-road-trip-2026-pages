<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自駕通用攻略</title><link rel="stylesheet" href="style.css"></head><body><main style="padding:20px;max-width:800px;margin:auto"><a href="./">← 返回 PWA</a><h1>日本自駕通用攻略</h1><p>這是公開通用攻略，不包含任何人的旅行路線、住宿與預約。</p><h2>停車與導航</h2><p>導航 Map Code 前請核對地圖目的地與停車場入口，並備用附近停車場。</p><h2>離線</h2><p>出發前下載 Google Maps 離線地圖，另外備份行程及重要聯絡方式。</p><h2>溫泉住宿</h2><p>實際規則請向飯店確認，包括停車、最後入住及大浴場時段。</p></main></body></html>
